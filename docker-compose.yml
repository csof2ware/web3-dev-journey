services:
  dev:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8545:8545"
      - "3000:3000"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airdrop
      POSTGRES_PASSWORD: airdrop
      POSTGRES_DB: airdrop
    ports:
      - "5432:5432"
