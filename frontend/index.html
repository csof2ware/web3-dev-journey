<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Airdrop Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: monospace; background: #0f172a; color: #e2e8f0; padding: 40px; }
    .card { max-width: 480px; margin: auto; background: #1e293b; padding: 24px; border-radius: 12px; }
    button { background: #7c3aed; color: white; border: 0; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin: 6px 0; }
    button:disabled { opacity: 0.4; }
    .muted { color: #94a3b8; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <h2>Airdrop Platform</h2>
  <p class="muted" id="status">MetaMask nao detectada</p>
  <button id="connect">Conectar MetaMask</button>
  <button id="claim" disabled>Fazer Claim</button>
  <p class="muted" id="info"></p>
</div>
<script>
var API = "http://localhost:3000";
var cfg = null;
var provider = null;

fetch(API + "/config").then(function (r) { return r.json(); }).then(function (c) { cfg = c; });

document.getElementById("connect").onclick = async function () {
  if (!window.ethereum) { alert("Instale a MetaMask"); return; }
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  var net = await provider.getNetwork();
  if (Number(net.chainId) !== 31337) {
    alert("Troque a MetaMask para a rede Hardhat Local (chainId 31337)");
    return;
  }
  var signer = await provider.getSigner();
  var addr = await signer.getAddress();
  var eth = ethers.formatEther(await provider.getBalance(addr));
  document.getElementById("status").textContent = "Conectado: " + addr;
  document.getElementById("info").textContent = "ETH: " + eth;
  document.getElementById("claim").disabled = false;
  await refresh(addr);
};

async function refresh(addr) {
  var token = new ethers.Contract(cfg.airdropAddress, [
    "function balanceOf(address account, uint256 id) view returns (uint256)"
  ], provider);
  var bal = await token.balanceOf(addr, 0);
  document.getElementById("info").textContent += " | Tokens: " + bal.toString();
}

document.getElementById("claim").onclick = async function () {
  var signer = await provider.getSigner();
  var addr = await signer.getAddress();
  var pr = await fetch(API + "/proof/" + addr);
  if (!pr.ok) { alert("Endereco nao elegivel"); return; }
  var proof = (await pr.json()).proof;
  var token = new ethers.Contract(cfg.airdropAddress, [
    "function claim(bytes32[] proof)"
  ], signer);
  var tx = await token.claim(proof);
  document.getElementById("info").textContent = "Tx enviada: " + tx.hash;
  await tx.wait();
  await refresh(addr);
};
</script>
</body>
</html>
