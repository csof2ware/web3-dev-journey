name: CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Compile
        run: npx hardhat compile
      - name: Testes
        run: npx hardhat test

  docker-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de producao
        run: docker build -f Dockerfile.prod -t airdrop-api .
